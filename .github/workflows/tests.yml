name: Testes de API

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Iniciar API, executar testes e gerar relatório
        run: npm run test:ci
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/gestao-de-alunos-test
          BASE_URL: http://127.0.0.1:3000
          ADMIN_EMAIL: admin@escola.com
          ADMIN_SENHA: admin123

      - name: Executar testes e gerar relatório
        run: npx mocha --reporter json --reporter-option output=test-results.json
        continue-on-error: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: test-results
          path: test-results.json

      - name: Publicar relatório
        uses: dorny/test-reporter@v3
        if: always()
        continue-on-error: true
        with:
          artifact: test-results
          name: Mocha Tests
          path: 'test-results.json'
          reporter: mocha-json